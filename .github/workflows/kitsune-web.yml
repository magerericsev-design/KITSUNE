name: Publish KITSUNE Web
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/kitsune-web.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: kitsune-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download verified game build
        run: |
          curl --fail --location --retry 3 --output game.zip https://github.com/magerericsev-design/KITSUNE/releases/download/v1.2.0/KITSUNE-Web-PWA-v2.zip
          echo "69a225c83024dd734b160c6fa3cfce5ea145f178abc5d1c3992584a2f1ae5bc4  game.zip" | sha256sum --check
          mkdir public
          unzip -q game.zip -d public
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
