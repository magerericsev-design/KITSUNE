name: Publish KITSUNE Web
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/kitsune-web.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: kitsune-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download verified builds
        run: |
          curl --fail --location --retry 3 --output old.zip https://github.com/magerericsev-design/KITSUNE/releases/download/v2.0.0/KITSUNE-Web-PWA-2.0.0.zip
          echo "978c512dfe9e0f9fa2594681ade30b8d03debbfb61d3bd33a6d1e064048bb9d8  old.zip" | sha256sum --check
          curl --fail --location --retry 3 --output game.zip https://github.com/magerericsev-design/KITSUNE/releases/download/v2.1.0/KITSUNE-Web-PWA-2.1.0.zip
          echo "c97c7b54ab76e05d5fda57197b52deb2e99ade4668b4dc92ea5f9638e76b9937  game.zip" | sha256sum --check
          mkdir -p public/v2 public/v2.1
          unzip -q old.zip -d public/v2
          unzip -q game.zip -d public/v2.1
          unzip -q game.zip -d public
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
