name: Retrait archive macOS KITSUNE
on:
  push:
    branches: [main]
    paths: [".github/workflows/retrait-macos.yml"]
permissions:
  contents: write
jobs:
  retirer:
    runs-on: ubuntu-latest
    steps:
      - name: Retirer uniquement l'archive macOS et sa description
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.2.0" > release.json
          python3 - <<'PY'
          import json, re
          with open('release.json',encoding='utf-8') as f: release=json.load(f)
          asset=[a for a in release['assets'] if a['name']=='KITSUNE-macOS-1.1-experimental.zip']
          if len(asset)>1: raise SystemExit('Several matching assets: stop')
          with open('asset-id.txt','w') as f: f.write(str(asset[0]['id']) if asset else '')
          body=release['body']
          body=re.sub(r'(?ms)^### macOS · 1\.1.*?(?=^### |^Le salon réseau)', '', body)
          body=re.sub(r'(?m)^- macOS expérimental : .*\n?', '', body)
          with open('body.txt','w',encoding='utf-8') as f: f.write(body)
          PY
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$(python3 -c "import json; print(json.load(open('release.json'))['id'])")" -F "body=@body.txt" >/dev/null
          if [ -s asset-id.txt ]; then gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$(cat asset-id.txt)"; fi
